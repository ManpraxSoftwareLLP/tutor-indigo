import json
from django.utils.translation import gettext as _
%>
##<%page args="mx_section" expression_filter="h"/>
<%page args="course_id" expression_filter="h"/>

## <%inherit file="../main.html" />

<link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap4.min.css">
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.24.0/moment.js"></script>

<style>
    .certificate-btn { cursor: pointer; }
    .certificate-btn:disabled { cursor: not-allowed; opacity: 0.5; }
    #userTable td:nth-child(2) { 
        min-width: 250px;
        word-wrap: break-word;
    }
</style>
  

<div id="wrapper" class="advanced-intructor">
    <div id="wrapper" class="advanced-instructor">
        <div class="container mt-4">
            <table id="userTable" class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Grade (%)</th>
                        <th>Status</th>
                        <th>Certificate</th>
                        <th>Modified at</th>
                        <th>Generated at</th>
                        <th>Action</th>
                    </tr>
                </thead>
                   
                    <tbody id="userTableBody"></tbody>
            </table>
            
            <nav>
                <ul id="pagination" class="pagination"></ul>
            </nav>
          
        </div>
    
  
        
    </div>

    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap4.min.js"></script>


    <script>
        $(document).ready(function() {
            function loadAdvancedInstructorData(page) {
                var baseUrl = window.location.origin;
                var course_id = "${course_id}";

                var url = baseUrl + '/api/mxcertification_api/get_user_data/?course_id=' + course_id + (page ? '&page=' + page : '');
                $.ajax({
                    url: url,
                    type: 'GET',
                    success: function(response) {
                        // Populate table
                        var $tbody = $('#userTableBody');
                        var $pagination = $('#pagination');
                        $tbody.empty();
                        $pagination.empty();

                        if (response.status === 'fail') {
                            $tbody.append('<tr><td colspan="6">' + response.message + '</td></tr>');
                            alert(response.message); // Show error message
                            return;
                        }

                        // Initialize or update DataTable
                        if ($.fn.DataTable.isDataTable('#userTable')) {
                            $('#userTable').DataTable().clear().destroy();
                        }

                        var table = $('#userTable').DataTable({
                            "paging": false,
                            "ordering": true,
                            "searching": true,
                            "stateSave": false
                        });

                        if (response.user_data && response.user_data.length) {
                            $.each(response.user_data, function(i, user) {
                                var buttonHtml;
                                if (user.certificate_status === 'Applicable') {
                                    buttonHtml = '<button class="btn btn-primary certificate-btn" data-username="' + user.username + '">Release Certificate</button>';
                                } else if (user.certificate_status === 'Generated') {
                                    buttonHtml = '<button class="btn btn-primary certificate-btn" disabled data-username="' + user.username + '">Generated</button>';
                                } else {
                                    buttonHtml = '<button class="btn btn-primary certificate-btn" disabled data-username="' + user.username + '">Not available</button>';
                                }
                           
                                table.row.add([user.fullname, user.email,user.grade,   user.status,  user.certificate_status, user.modified_at, user.certificate_issueon, buttonHtml  ]);
                            });
                            table.draw();
                            console.log('DataTable initialized');
                        } else {
                            $tbody.append('<tr><td colspan="6">No users found.</td></tr>');
                        }

                        // Destroy existing DataTable if it exists
                        // if ($.fn.DataTable.isDataTable('#userTable')) {
                        //     $('#userTable').DataTable().destroy();
                        //     // $('#userTable').empty();
                        // }

                        // Initialize DataTable
                        // $('#userTable').DataTable({
                        //     "paging": false,
                        //     "ordering": true,
                        //     "searching": true,
                        //     "stateSave": false
                        // });

                        // console.log('DataTable initialized');

                        // Populate pagination
                        var $pagination = $('#pagination');
                        $pagination.empty();
                        if (response.has_previous) {
                            $pagination.append('<li class="page-item"><a class="page-link" href="#" data-page="' + response.previous_page_number + '">Previous</a></li>');
                        }
                        for (var i = 1; i <= response.total_pages; i++) {
                            $pagination.append(
                                '<li class="page-item' + (i === response.current_page ? ' active' : '') + '">' +
                                    '<a class="page-link" href="#" data-page="' + i + '">' + i + '</a>' +
                                '</li>'
                            );
                        }
                        if (response.has_next) {
                            $pagination.append('<li class="page-item"><a class="page-link" href="#" data-page="' + response.next_page_number + '">Next</a></li>');
                        }

                        // Handle pagination clicks
                        $pagination.find('a').click(function(e) {
                            e.preventDefault();
                            var page = $(this).data('page');
                            loadAdvancedInstructorData(page);
                        });

                        // Handle certificate button clicks
                        $('.certificate-btn:not(:disabled)').click(function() {
                            var username = $(this).data('username');
                            var button = $(this);
                            $.ajax({
                                url: baseUrl + '/api/mxcertification_api/release_certificate/',
                                method: 'POST',
                                data: { username: username, course_id: course_id },
                                headers: {
                                    'X-CSRFToken': getCookie('csrftoken')
                                },
                                success: function(response) {
                                    if (response.status === 'Generated') {
                                        button.prop('disabled', true);
                                        button.text('Generated');
                                        button.closest('tr').find('td:eq(4)').text('Generated');
                                        alert(response.message);
                                    } 

                                    else if (response.status === 'Progress') {
                                        button.prop('disabled', true);
                                        button.text('In Progress');
                                        button.closest('tr').find('td:eq(4)').text('In Progress');
                                        alert(response.message);
                                    } 
                                    
                                    else {
                                        alert(response.message);
                                    }
                                },
                                error: function(xhr) {
                                    console.log('Error response:', xhr.responseText);
                                    var errorMsg = 'Error releasing certificate';
                                    try {
                                        var response = JSON.parse(xhr.responseText);
                                        errorMsg = response.message || errorMsg;
                                    } catch (e) {
                                        // Fallback if response is not JSON
                                    }
                                    alert(errorMsg);
                                }
                            });
                        });

                        function getCookie(name) {
                            let cookieValue = null;
                            if (document.cookie && document.cookie !== '') {
                                const cookies = document.cookie.split(';');
                                for (let i = 0; i < cookies.length; i++) {
                                    const cookie = cookies[i].trim();
                                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                                        break;
                                    }
                                }
                            }
                            return cookieValue;
                        }
                    },
                    error: function(xhr) {
                        $('#userTableBody').html('<tr><td colspan="6">Error loading data: ' + xhr.statusText + '</td></tr>');
                    }
                });
            }


            function initializeAdvancedInstructor() {
                if (window.location.hash === '#view-certificate_managment') {
                    loadAdvancedInstructorData();
                }
            }

         

            // $('.instructor-nav .btn-link').on('click', function(e) {
            //     alert("tab clcik")
            //     e.preventDefault();
            //     var $this = $(this),
            //         sectionName = $this.data('section');

            //     $('.idash-section').addClass('hidden');
            //     $('#' + sectionName).removeClass('hidden');

            //     if (sectionName === 'certificate_managment') {
            //         console.log('Advanced Instructor tab activated');
            //         loadAdvancedInstructorData();
            //     }

            //     $('.instructor-nav .btn-link').removeClass('active');
            //     $this.addClass('active');
            // });

            $(document).on('click', '.instructor-nav .btn-link', function(e) {
                e.preventDefault();
                var $this = $(this),
                    sectionName = $this.data('section');

                $('.idash-section').addClass('hidden');
                $('#' + sectionName).removeClass('hidden');

                if (sectionName === 'certificate_management') {
                    loadAdvancedInstructorData();
                }

                $('.instructor-nav .btn-link').removeClass('active');
                $this.addClass('active');
            });


            // Handle hash changes
            $(window).on('hashchange', function() {
                initializeAdvancedInstructor();
            });

            // Initialize on page load
            initializeAdvancedInstructor();
        });
    </script>

    
</div>
